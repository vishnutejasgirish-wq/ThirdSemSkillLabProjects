<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid vs Flexbox</title>
  <style>
    .item {
      background-color: orange;
      padding: 20px;
      text-align: center;
      font-size: 20px;
    }

    /* FLEXBOX: one direction (a row) */
    .flex {
      display: flex;
      gap: 10px;
    }

    /* GRID: rows AND columns. Here: 3 equal columns */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

  <h2>Flexbox: everything in one row</h2>
  <div class="flex">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
  </div>

  <h2>Grid: 3 columns, so it makes 2 rows</h2>
  <div class="grid">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
  </div>

  <!--
    Use FLEXBOX for a row of things (navbar, buttons, cards).
    Use GRID for rows + columns (photo gallery, page layout).
    TRY THIS: change grid-template-columns to 1fr 1fr  (2 columns)
  -->

</body>
</html>

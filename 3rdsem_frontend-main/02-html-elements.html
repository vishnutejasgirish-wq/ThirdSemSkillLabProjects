<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Elements</title>
</head>
<body>

  <!-- header = top part of the page -->
  <header>
    <h1>My Profile</h1>          <!-- h1 = biggest heading -->

    <!-- nav = navigation links -->
    <nav>
      <a href="#about">About</a>    <!-- # = jump to id="about" on this page -->
      <a href="#skills">Skills</a>
    </nav>
  </header>

  <!-- main = the main content -->
  <main>

    <section id="about">
      <h2>About me</h2>            <!-- h2 = smaller heading -->
      <p>I am a student at RVCE.</p>   <!-- p = paragraph -->

      <!-- img: src = which picture, alt = description of the picture -->
      <img src="https://picsum.photos/150" alt="My photo">

      <!-- ul = bullet list, li = list item -->
      <ul>
        <li>I like coding</li>
        <li>I like music</li>
      </ul>

      <!-- ol = numbered list -->
      <ol>
        <li>Learn HTML</li>
        <li>Learn CSS</li>
      </ol>
    </section>

    <section id="skills">
      <h2>Skills</h2>

      <!-- table: tr = row, th = heading cell, td = normal cell -->
      <table border="1">
        <tr>
          <th>Skill</th>
          <th>Level</th>
        </tr>
        <tr>
          <td>HTML</td>
          <td>Beginner</td>
        </tr>
        <tr>
          <td>C</td>
          <td>Good</td>
        </tr>
      </table>
    </section>

    <!-- a link to another website -->
    <p>Visit <a href="https://www.rvce.edu.in">RVCE website</a></p>

  </main>

  <!-- footer = bottom of the page -->
  <footer>
    <p>© 2026 Vishal</p>
  </footer>

</body>
</html>

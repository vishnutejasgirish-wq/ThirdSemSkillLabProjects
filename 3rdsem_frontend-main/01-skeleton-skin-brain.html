<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML, CSS and JS</title>

  <!-- SKIN = CSS: how the page LOOKS -->
  <!-- TRY THIS: delete this whole <style> block, save, and refresh -->
  <style>
    body {
      background-color: lightyellow;
      font-family: Arial;
      text-align: center;
    }
    h1 {
      color: navy;
    }
    button {
      background-color: orange;
      padding: 10px 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- SKELETON = HTML: WHAT is on the page -->
  <h1>Vishal</h1>
  <p>3rd semester CSE student</p>

  <!-- BRAIN = JavaScript: what the page DOES when you click -->
  <!-- TRY THIS: delete onclick="..." and the button does nothing -->
  <button onclick="alert('Hello! I am JavaScript')">Click me</button>

</body>
</html>

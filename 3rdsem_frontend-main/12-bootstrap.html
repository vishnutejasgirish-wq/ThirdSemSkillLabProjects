<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap</title>

  <!-- Bootstrap = ready-made CSS. This line loads it from the internet. -->
  <!-- TRY THIS: delete this line, save, and see the plain page -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

  <div class="container">
    <h1>Hello, Bootstrap!</h1>
    <p>We wrote NO CSS. The class names do the styling.</p>

    <!-- btn = button style, btn-primary = blue, btn-success = green -->
    <button class="btn btn-primary">Blue button</button>
    <button class="btn btn-success">Green button</button>

    <!-- row + col-md-4 = 3 columns on laptop, stacked on phone -->
    <div class="row mt-4">
      <div class="col-md-4 border p-3">Column 1</div>
      <div class="col-md-4 border p-3">Column 2</div>
      <div class="col-md-4 border p-3">Column 3</div>
    </div>
  </div>

</body>
</html>

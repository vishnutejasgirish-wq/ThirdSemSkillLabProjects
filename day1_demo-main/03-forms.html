<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 16px; }
    form { display: flex; flex-direction: column; gap: 6px; }
    label { font-weight: 600; margin-top: 10px; }
    input, select, textarea { padding: 8px; font-size: 16px; }
    input:invalid:not(:placeholder-shown) { border: 2px solid #c2382b; }  /* red when wrong */
    input:valid:not(:placeholder-shown)   { border: 2px solid #3e7d5a; }  /* green when right */
    button { margin-top: 16px; padding: 10px; font-size: 16px; }
    .row { display: flex; gap: 16px; align-items: center; font-weight: normal; }
    #result { background: #e4f2e6; padding: 12px; margin-top: 16px; display: none; }
  </style>
</head>
<body>
  <h1>Student Registration</h1>
  <p>Try submitting it empty, or with a wrong email. The browser checks it for you, no JavaScript needed.</p>

  <form id="regForm">
    <!-- label "for" must match input "id": click the label text to test -->
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Vishal" required>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="vishal@example.com" required>

    <label for="usn">USN (pattern: 1RV + 2 digits + 2 letters + 3 digits)</label>
    <input type="text" id="usn" placeholder="1RV24CS001" pattern="1RV[0-9]{2}[A-Z]{2}[0-9]{3}" required>

    <label for="sem">Semester (1–8)</label>
    <input type="number" id="sem" placeholder="3" min="1" max="8" required>

    <label for="pwd">Password (min 8 characters)</label>
    <input type="password" id="pwd" placeholder="********" minlength="8" required>

    <label for="course">Course (drop-down)</label>
    <select id="course">
      <option>CSE</option>
      <option>ISE</option>
      <option>ECE</option>
    </select>

    <label>Gender (radio: pick ONE)</label>
    <div class="row">
      <label class="row"><input type="radio" name="g" value="F"> Female</label>
      <label class="row"><input type="radio" name="g" value="M"> Male</label>
      <label class="row"><input type="radio" name="g" value="O"> Other</label>
    </div>

    <label>Interests (checkbox: pick MANY)</label>
    <div class="row">
      <label class="row"><input type="checkbox"> Web</label>
      <label class="row"><input type="checkbox"> AI</label>
      <label class="row"><input type="checkbox"> Robotics</label>
    </div>

    <label for="dob">Date of birth</label>
    <input type="date" id="dob">

    <label for="color">Favourite colour</label>
    <input type="color" id="color" value="#2f5fa8">

    <label for="msg">Message (textarea)</label>
    <textarea id="msg" rows="3"></textarea>

    <button type="submit">Register</button>
  </form>

  <div id="result">✔ All fields valid. The form would now be sent to the server (Day 3).</div>

  <script>
    // Only runs if the browser's own validation passed
    document.getElementById("regForm").addEventListener("submit", function (e) {
      e.preventDefault(); // stop the page from reloading for this demo
      document.getElementById("result").style.display = "block";
    });
  </script>
</body>
</html>

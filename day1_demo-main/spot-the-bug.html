<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spot the Bug</title>
  <!-- BUG A: the stylesheet name is wrong, so none of the CSS loads. Check the Network tab: 404! -->
  <link rel="stylesheet" href="styles.css">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 16px; }
  </style>
</head>
<body>
  <h1>Spot the bug page</h1>
  <p>Four things on this page are broken. Use the page AND DevTools (F12) to find them.</p>

  <nav>
    <!-- BUG B: href="#Projects" but the id below is "projects" (ids are case-sensitive) -->
    <a href="#Projects">Jump to Projects</a>
  </nav>

  <!-- BUG C: no alt text on the image -->
  <img src="https://picsum.photos/200">

  <form>
    <!-- BUG D: label for="mail" does not match input id="email". Click the label: nothing happens -->
    <label for="mail">Email</label>
    <input type="email" id="email" required>
    <button type="submit">Send</button>
  </form>

  <div style="height: 1200px"></div>
  <section id="projects">
    <h2>Projects</h2>
    <p>You should land here when you click the nav link.</p>
  </section>
</body>
</html>

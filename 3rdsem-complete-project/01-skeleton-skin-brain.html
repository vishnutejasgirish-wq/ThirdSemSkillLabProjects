<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 - Skeleton, Skin, and Brain</title>
  <style id="pageBaseStyle">
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 2rem 1.25rem;
      max-width: 820px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #e2e8f0;
    }
    .back-link {
      text-decoration: none;
      color: #4f46e5;
      font-weight: 700;
      background: #eef2ff;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 1.25rem 0;
      background: #ffffff;
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .toggle-btn {
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: 2px solid #cbd5e1;
      background: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .toggle-btn.active {
      border-color: #4f46e5;
      background: #4f46e5;
      color: white;
    }
  </style>
  <style id="demoSkinStyle">
    .profile-card {
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 14px 28px -6px rgba(15, 23, 42, 0.08);
      border: 2px solid #e2e8f0;
      margin-top: 1rem;
      transition: all 0.3s ease;
    }
    .profile-card.dark-mode {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      border-color: #4f46e5;
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #4f46e5;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }
    .action-btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 0.5rem;
      margin-top: 0.75rem;
    }
    .action-btn:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="index.html" class="back-link">← Back to index.html</a>
    <a href="02-html-elements.html" class="back-link">Next: 02 HTML Elements →</a>
  </div>

  <h1>01. Skeleton (HTML), Skin (CSS) &amp; Brain (JS)</h1>
  <p>Use the switches below to strip away CSS or disable JavaScript to see what each web layer does:</p>

  <div class="controls">
    <button class="toggle-btn active" id="btnHtml" onclick="alertMsg('HTML Skeleton is always required for page content!')">🦴 HTML Skeleton: ON</button>
    <button class="toggle-btn active" id="btnCss" onclick="toggleCssLayer()">🎨 CSS Skin: ON</button>
    <button class="toggle-btn active" id="btnJs" onclick="toggleJsLayer()">🧠 JS Brain: ON</button>
  </div>

  <p id="statusNotice" style="color:#4f46e5; font-weight:600; font-size:0.9rem; min-height:1.4rem;"></p>

  <!-- Target Demo Card -->
  <div class="profile-card" id="cardElement">
    <div class="avatar">VP</div>
    <h2>Student Developer Card</h2>
    <p><strong>Role:</strong> Full-Stack Web Explorer (RVCE)</p>
    <p><strong>Kudos Counter:</strong> <span id="likeCount">12</span> claps</p>
    <button class="action-btn" onclick="giveKudos()">👏 Give Kudos (JS Event)</button>
    <button class="action-btn" style="background:#059669;" onclick="toggleCardTheme()">🌗 Toggle Card Theme (JS DOM)</button>
  </div>

  <script>
    let cssEnabled = true;
    let jsEnabled = true;
    let likes = 12;

    function alertMsg(msg) {
      document.getElementById('statusNotice').textContent = msg;
    }

    function toggleCssLayer() {
      cssEnabled = !cssEnabled;
      document.getElementById('demoSkinStyle').disabled = !cssEnabled;
      const btn = document.getElementById('btnCss');
      btn.textContent = cssEnabled ? '🎨 CSS Skin: ON' : '🎨 CSS Skin: OFF (Raw HTML)';
      btn.classList.toggle('active', cssEnabled);
      alertMsg(cssEnabled ? 'CSS Skin restored!' : 'CSS Skin disabled — notice the unstyled raw HTML skeleton!');
    }

    function toggleJsLayer() {
      jsEnabled = !jsEnabled;
      const btn = document.getElementById('btnJs');
      btn.textContent = jsEnabled ? '🧠 JS Brain: ON' : '🧠 JS Brain: OFF';
      btn.classList.toggle('active', jsEnabled);
      alertMsg(jsEnabled ? 'JavaScript Brain enabled!' : 'JavaScript Brain disabled — buttons inside the card will not respond!');
    }

    function giveKudos() {
      if (!jsEnabled) {
        alertMsg('⚠️ JS Brain is currently OFF! Turn JS ON to handle button clicks.');
        return;
      }
      likes++;
      document.getElementById('likeCount').textContent = likes;
      alertMsg('🎉 JS updated the DOM! Kudos count is now ' + likes + '.');
    }

    function toggleCardTheme() {
      if (!jsEnabled) {
        alertMsg('⚠️ JS Brain is currently OFF! Turn JS ON to toggle dark mode.');
        return;
      }
      document.getElementById('cardElement').classList.toggle('dark-mode');
      alertMsg('✨ JS toggled the .dark-mode CSS class on the card!');
    }
  </script>
</body>
</html>

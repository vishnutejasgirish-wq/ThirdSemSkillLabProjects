<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 - Flexbox Playground</title>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #0f172a; padding: 2rem 1.25rem; max-width: 900px; margin: 0 auto; line-height: 1.6; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #e2e8f0; }
    .back-link { text-decoration: none; color: #4f46e5; font-weight: 700; background: #eef2ff; padding: 0.45rem 0.9rem; border-radius: 8px; font-size: 0.9rem; }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; background: white; padding: 1.25rem; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 0.3rem; font-family: monospace; }
    select { width: 100%; padding: 0.5rem; border-radius: 8px; border: 1px solid #cbd5e1; font-family: monospace; font-weight: 600; }
    .flex-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      min-height: 240px;
      background: #0f172a;
      padding: 1.5rem;
      border-radius: 18px;
      transition: all 0.25s;
    }
    .flex-item {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      font-weight: 800;
      padding: 1.25rem 1.75rem;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="index.html" class="back-link">← Back to index.html</a>
    <a href="09-responsive.html" class="back-link">Next: 09 Responsive →</a>
  </div>

  <h1>08. CSS Flexbox Interactive Playground</h1>
  <div class="controls">
    <div>
      <label>flex-direction</label>
      <select id="selDir" onchange="updateFlex()">
        <option value="row">row</option>
        <option value="row-reverse">row-reverse</option>
        <option value="column">column</option>
      </select>
    </div>
    <div>
      <label>justify-content</label>
      <select id="selJustify" onchange="updateFlex()">
        <option value="space-between" selected>space-between</option>
        <option value="center">center</option>
        <option value="flex-start">flex-start</option>
        <option value="flex-end">flex-end</option>
        <option value="space-around">space-around</option>
        <option value="space-evenly">space-evenly</option>
      </select>
    </div>
    <div>
      <label>align-items</label>
      <select id="selAlign" onchange="updateFlex()">
        <option value="center" selected>center</option>
        <option value="stretch">stretch</option>
        <option value="flex-start">flex-start</option>
        <option value="flex-end">flex-end</option>
      </select>
    </div>
  </div>

  <div class="flex-container" id="flexStage">
    <div class="flex-item">Box 1</div>
    <div class="flex-item">Box 2 (Taller)</div>
    <div class="flex-item">Box 3</div>
  </div>

  <script>
    function updateFlex() {
      const stage = document.getElementById('flexStage');
      stage.style.flexDirection = document.getElementById('selDir').value;
      stage.style.justifyContent = document.getElementById('selJustify').value;
      stage.style.alignItems = document.getElementById('selAlign').value;
    }
  </script>
</body>
</html>
